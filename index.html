
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Hash</title>
</head>
<body>

    <h1>Desafio: Colisão de Hash</h1>

    <p>Vamos testar duas palavras diferentes:</p>

    <p>Palavra 1: amor</p>
    <p>Palavra 2: roma</p>

    <button onclick="testarHash()">Calcular Hash</button>

    <h2 id="resultado"></h2>

    <script>
        function calcula_hash(palavra) {
            let hash = 0;

            for (let i = 0; i < palavra.length; i++) {
                hash += palavra.charCodeAt(i);
            }

            return hash;
        }

        function testarHash() {
            let palavra1 = "amor";
            let palavra2 = "roma";

            let hash1 = calcula_hash(palavra1);
            let hash2 = calcula_hash(palavra2);

            document.getElementById("resultado").innerHTML =
                "Hash de amor: " + hash1 + "<br>" +
                "Hash de roma: " + hash2 + "<br><br>" +
                "As duas palavras possuem o mesmo hash!";
        }
    </script>

</body>
</html>
